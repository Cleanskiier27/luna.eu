name: Test and publish LunaRecycle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      documentation_ready: ${{ steps.docs.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate static application
        shell: bash
        run: |
          set -euo pipefail
          test -f GITREPOVSLOCAL/networkbuster/index.html
          test -f GITREPOVSLOCAL/networkbuster/app.js
          test -f GITREPOVSLOCAL/networkbuster/index.css
          test -f GITREPOVSLOCAL/networkbuster/history.html
          test -f GITREPOVSLOCAL/html-fetch-tool/index.html
          test -f GITREPOVSLOCAL/launch.html
          test -f GITREPOVSLOCAL/admin.html
          test -f GITREPOVSLOCAL/azure-devops-dashboard.html
          grep -q 'id="pipelines"' GITREPOVSLOCAL/azure-devops-dashboard.html
          test -f GITREPOVSLOCAL/imported-programs/index.html
          test -f GITREPOVSLOCAL/imported-programs/flash-commands.html
          ! grep -R -nE 'gho_[A-Za-z0-9]+|access_token=[A-Za-z0-9._-]+' GITREPOVSLOCAL README.md
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Parser(HTMLParser):
              pass
          for path in Path('GITREPOVSLOCAL').rglob('*.html'):
              Parser().feed(path.read_text(encoding='utf-8'))
              print(f'validated {path}')
          PY
      - name: Documentation phase
        id: docs
        shell: bash
        run: |
          set -euo pipefail
          test -s GITREPOVSLOCAL/documentation.html
          grep -q 'PHASE 6' GITREPOVSLOCAL/documentation.html
          grep -q 'Documentation' GITREPOVSLOCAL/index.html
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: GITREPOVSLOCAL

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
