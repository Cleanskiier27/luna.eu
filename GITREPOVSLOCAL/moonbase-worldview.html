<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>@moonbase.bot // World View</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Courier New",monospace;color:#cfe8ff}
  canvas{display:block;width:100%;height:100%}
  #hud{position:absolute;left:12px;top:10px;font-size:12px;line-height:1.5;text-shadow:0 0 4px #000;pointer-events:none}
  #hud b{color:#ffb800}
  #ctl{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  #ctl button{background:rgba(4,16,36,.8);color:#8eeeff;border:1px solid #2b64a8;padding:5px 9px;font:11px "Courier New",monospace;cursor:pointer}
  #ctl button.on,#ctl button:hover{border-color:#ffb800;color:#ffb800}
  #zoom{position:absolute;left:12px;bottom:12px;width:200px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<input id="zoom" type="range" min="0" max="1000" value="0" aria-label="Zoom">
<div id="ctl">
  <button id="b-orbit" type="button">ORBIT</button>
  <button id="b-approach" type="button">APPROACH</button>
  <button id="b-site" type="button">SITE</button>
  <button id="b-auto" type="button" class="on">AUTO ZOOM</button>
  <button id="b-labels" type="button" class="on">LABELS</button>
  <button id="b-build" type="button">BUILD SIM</button>
</div>
<script>
(() => {
"use strict";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const hud = document.getElementById("hud"), zoomEl = document.getElementById("zoom");
let W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1);

// Deterministic PRNG so the terrain is stable between frames.
function rng(seed){ let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// Base site: Shackleton rim, lunar south pole (89.9°S). Sun sits low on the horizon -> long shadows.
const SITE = { name: "SHACKLETON RIM // 89.9°S 0.0°E", lat: -89.9, lon: 0 };
const SUN_DIR = { x: -0.92, y: -0.18 }; // light from the left, grazing

const state = { z: 0, target: 0, auto: true, labels: true, build: false, buildT: 0, t: 0 };

// ---------- pre-rendered layers ----------
let stars, moonTex, terrain;

function makeStars(){
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d"), r = rng(7);
  for (let i = 0; i < (W * H) / 900; i++){
    const a = r() ** 3, s = r() < 0.02 ? 1.6 : 0.8;
    g.fillStyle = `rgba(${200 + r() * 55|0},${210 + r() * 45|0},255,${0.25 + a * 0.75})`;
    g.fillRect(r() * W, r() * H, s, s);
  }
  return c;
}

// Moon globe texture: maria + craters, lit with a terminator.
function makeMoon(R){
  const S = R * 2, c = document.createElement("canvas"); c.width = c.height = S;
  const g = c.getContext("2d"), r = rng(42);
  g.save(); g.beginPath(); g.arc(R, R, R, 0, Math.PI * 2); g.clip();
  g.fillStyle = "#9a978f"; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 9; i++){ // maria (dark basalt plains)
    const x = r() * S, y = r() * S * 0.8, rr = R * (0.15 + r() * 0.35);
    const gr = g.createRadialGradient(x, y, 0, x, y, rr);
    gr.addColorStop(0, "rgba(70,70,72,0.75)"); gr.addColorStop(1, "rgba(70,70,72,0)");
    g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, rr, rr * (0.6 + r() * 0.4), r() * 3, 0, Math.PI * 2); g.fill();
  }
  for (let i = 0; i < 700; i++) crater(g, r() * S, r() * S, (r() ** 4) * R * 0.18 + 1, r, 0.5);
  // spherical shading + terminator
  const sh = g.createRadialGradient(R * 0.55, R * 0.7, R * 0.1, R, R, R * 1.05);
  sh.addColorStop(0, "rgba(255,250,240,0.10)"); sh.addColorStop(0.7, "rgba(0,0,0,0.15)"); sh.addColorStop(1, "rgba(0,0,0,0.75)");
  g.fillStyle = sh; g.fillRect(0, 0, S, S);
  const term = g.createLinearGradient(S * 0.55, 0, S, 0);
  term.addColorStop(0, "rgba(0,0,0,0)"); term.addColorStop(0.35, "rgba(0,0,0,0.85)"); term.addColorStop(1, "rgba(0,0,0,0.97)");
  g.fillStyle = term; g.fillRect(0, 0, S, S);
  g.restore();
  return c;
}

function crater(g, x, y, rr, r, strength){
  // dark floor on the sun-facing inner wall, bright rim on the far side
  const ox = -SUN_DIR.x * rr * 0.25, oy = -SUN_DIR.y * rr * 0.25;
  g.fillStyle = `rgba(30,30,32,${0.35 * strength + 0.2})`;
  g.beginPath(); g.arc(x - ox * 0.6, y - oy * 0.6, rr, 0, Math.PI * 2); g.fill();
  g.fillStyle = `rgba(220,215,205,${0.25 * strength + 0.1})`;
  g.beginPath(); g.arc(x + ox, y + oy, rr * 0.92, 0, Math.PI * 2); g.fill();
  g.fillStyle = `rgba(120,118,112,${0.9})`;
  g.beginPath(); g.arc(x, y, rr * 0.82, 0, Math.PI * 2); g.fill();
}

// Surface terrain at the site, perspective-free top-down-oblique (rendered once, scaled during zoom).
function makeTerrain(w, h){
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"), r = rng(1969);
  const base = g.createLinearGradient(0, 0, 0, h);
  base.addColorStop(0, "#5f5d58"); base.addColorStop(1, "#8b8880");
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  // regolith grain
  const id = g.getImageData(0, 0, w, h), d = id.data;
  for (let i = 0; i < d.length; i += 4){ const n = (r() - 0.5) * 26; d[i] += n; d[i+1] += n; d[i+2] += n; }
  g.putImageData(id, 0, 0);
  // craters, small to large, with long low-sun shadows
  for (let i = 0; i < 260; i++){
    const rr = (r() ** 3) * w * 0.06 + 2, x = r() * w, y = r() * h;
    if (Math.hypot(x - w * 0.5, y - h * 0.55) < w * 0.2) continue; // graded pad around the base
    craterOblique(g, x, y, rr);
  }
  // graded landing/construction pad (sintered regolith)
  const pad = g.createRadialGradient(w * 0.5, h * 0.56, 0, w * 0.5, h * 0.56, w * 0.22);
  pad.addColorStop(0, "rgba(150,146,138,0.95)"); pad.addColorStop(0.8, "rgba(130,126,118,0.6)"); pad.addColorStop(1, "rgba(130,126,118,0)");
  g.fillStyle = pad; g.beginPath(); g.ellipse(w * 0.5, h * 0.56, w * 0.24, h * 0.16, 0, 0, Math.PI * 2); g.fill();
  // rover tracks
  g.strokeStyle = "rgba(55,54,50,0.55)"; g.lineWidth = 1.2;
  for (const off of [-3, 3]){
    g.beginPath(); g.moveTo(w * 0.05, h * 0.92 + off);
    g.bezierCurveTo(w * 0.25, h * 0.7 + off, w * 0.35, h * 0.62 + off, w * 0.44, h * 0.6 + off); g.stroke();
  }
  return c;
}

function craterOblique(g, x, y, rr){
  const ry = rr * 0.55; // foreshortened
  g.fillStyle = "rgba(25,25,26,0.85)"; // shadowed interior (sun from left -> left inner wall dark)
  g.beginPath(); g.ellipse(x, y, rr, ry, 0, 0, Math.PI * 2); g.fill();
  g.save(); g.beginPath(); g.ellipse(x, y, rr, ry, 0, 0, Math.PI * 2); g.clip();
  g.fillStyle = "rgba(170,166,158,0.9)"; // lit far wall
  g.beginPath(); g.ellipse(x + rr * 0.55, y, rr * 0.75, ry * 0.95, 0, 0, Math.PI * 2); g.fill();
  g.restore();
  g.strokeStyle = "rgba(200,196,188,0.55)"; g.lineWidth = Math.max(0.6, rr * 0.08); // raised rim
  g.beginPath(); g.ellipse(x, y, rr * 1.04, ry * 1.04, 0, -Math.PI * 0.35, Math.PI * 0.35); g.stroke();
  // long cast shadow on the right of the rim
  const sg = g.createLinearGradient(x + rr, y, x + rr * 3, y);
  sg.addColorStop(0, "rgba(0,0,0,0.35)"); sg.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = sg; g.beginPath(); g.ellipse(x + rr * 1.8, y, rr * 1.2, ry * 0.5, 0, 0, Math.PI * 2); g.fill();
}

// ---------- base structures (vector, drawn live so they stay sharp) ----------
// Each structure appears at a build step (1..5) during BUILD SIM.
function drawBase(cx, cy, s, step, labels){
  const items = [];
  const show = n => !state.build || step >= n;
  const fade = n => !state.build ? 1 : Math.max(0, Math.min(1, step - n + 1));

  // 01 Solar arrays (vertical-tracking, tall because the sun is on the horizon at the pole)
  if (show(1)) for (const [dx, a] of [[-0.42, 0], [-0.32, 0], [0.34, 0], [0.44, 0]]){
    ctx.globalAlpha = fade(1);
    const x = cx + dx * s, y = cy - 0.02 * s, pw = 0.035 * s, ph = 0.16 * s;
    shadow(x, y, pw * 0.5, ph);
    ctx.fillStyle = "#555"; ctx.fillRect(x - 1, y - ph * 0.4, 2, ph * 0.4);
    const pg = ctx.createLinearGradient(x - pw, 0, x + pw, 0);
    pg.addColorStop(0, "#2a3f6e"); pg.addColorStop(0.5, "#1a2850"); pg.addColorStop(1, "#0c1430");
    ctx.fillStyle = pg; ctx.fillRect(x - pw / 2, y - ph, pw, ph * 0.62);
    ctx.strokeStyle = "rgba(160,190,255,0.35)"; ctx.lineWidth = 0.6;
    for (let k = 1; k < 6; k++){ const yy = y - ph + (ph * 0.62) * k / 6; ctx.beginPath(); ctx.moveTo(x - pw/2, yy); ctx.lineTo(x + pw/2, yy); ctx.stroke(); }
    ctx.fillStyle = "rgba(255,240,210,0.25)"; ctx.fillRect(x - pw / 2, y - ph, pw * 0.18, ph * 0.62); // sun glint
    if (dx === -0.42) items.push(["01 SOLAR POWER BUS", x, y - ph]);
  }
  ctx.globalAlpha = 1;

  // 02 Airlock module (cylinder)
  if (show(2)){
    ctx.globalAlpha = fade(2);
    const x = cx - 0.19 * s, y = cy + 0.01 * s, w = 0.1 * s, h = 0.045 * s;
    shadow(x + w * 0.5, y, w * 0.6, h);
    cylinder(x - w / 2, y - h, w, h, "#d9d6cf", "#7d7a73");
    ctx.fillStyle = "#222"; ctx.fillRect(x - w / 2 - 0.012 * s, y - h * 0.8, 0.012 * s, h * 0.7);
    items.push(["02 EVA AIRLOCK", x, y - h]);
  }
  ctx.globalAlpha = 1;

  // 03 Regolith-shielded habitat dome
  if (show(3)){
    ctx.globalAlpha = fade(3);
    const r = 0.13 * s, y = cy + 0.03 * s;
    shadow(cx + r * 0.3, y, r * 1.3, r * 0.9);
    const dg = ctx.createRadialGradient(cx - r * 0.55, y - r * 0.7, r * 0.05, cx, y - r * 0.3, r * 1.15);
    dg.addColorStop(0, "#cfcbc2"); dg.addColorStop(0.45, "#8f8b83"); dg.addColorStop(1, "#2e2d2a");
    ctx.fillStyle = dg; ctx.beginPath(); ctx.ellipse(cx, y, r, r * 0.82, 0, Math.PI, 0); ctx.closePath(); ctx.fill();
    // 3D-printed regolith layer lines
    ctx.strokeStyle = "rgba(0,0,0,0.18)"; ctx.lineWidth = 0.7;
    for (let k = 1; k < 9; k++){ const f = k / 9; ctx.beginPath(); ctx.ellipse(cx, y, r * Math.sqrt(1 - f * f), r * 0.12, 0, Math.PI, 0); ctx.stroke(); ctx.translate(0, -r * 0.82 / 9); }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // viewport windows glowing
    ctx.fillStyle = "rgba(255,200,120,0.85)";
    for (const wx of [-0.45, -0.15, 0.15]){ ctx.beginPath(); ctx.ellipse(cx + wx * r, y - r * 0.18, r * 0.06, r * 0.035, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = "#3a3936"; ctx.fillRect(cx - r - 0.06 * s, y - 0.018 * s, 0.07 * s, 0.018 * s); // tunnel to airlock
    items.push(["03 HABITAT DOME (REGOLITH SHIELD)", cx, y - r * 0.82]);
  }
  ctx.globalAlpha = 1;

  // 04 Comms mast
  if (show(4)){
    ctx.globalAlpha = fade(4);
    const x = cx + 0.2 * s, y = cy + 0.0 * s, h = 0.26 * s;
    shadow(x, y, 0.01 * s, h);
    ctx.strokeStyle = "#bdb9b0"; ctx.lineWidth = Math.max(1, 0.006 * s);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - h); ctx.stroke();
    ctx.lineWidth = 0.6; ctx.strokeStyle = "#8a877f";
    for (let k = 0; k < 10; k++){ const y0 = y - h * k / 10, y1 = y - h * (k + 1) / 10; ctx.beginPath(); ctx.moveTo(x - 3, y0); ctx.lineTo(x + 3, y1); ctx.stroke(); }
    ctx.fillStyle = "#e6e3dc"; ctx.beginPath(); ctx.ellipse(x - 0.015 * s, y - h, 0.03 * s, 0.014 * s, -0.5, 0, Math.PI * 2); ctx.fill();
    const blink = (Math.sin(state.t * 4) + 1) / 2;
    ctx.fillStyle = `rgba(255,60,40,${0.3 + blink * 0.7})`; ctx.beginPath(); ctx.arc(x, y - h - 3, 2, 0, Math.PI * 2); ctx.fill();
    items.push(["04 OPTICAL COMMS MAST", x, y - h]);
  }
  ctx.globalAlpha = 1;

  // 05 Laser uplink to SatGPU relay (beam toward upper-right)
  if (show(5)){
    ctx.globalAlpha = fade(5) * (0.5 + 0.5 * Math.sin(state.t * 2) ** 2);
    const x = cx + 0.185 * s, y = cy - 0.26 * s;
    const bg = ctx.createLinearGradient(x, y, W, 0);
    bg.addColorStop(0, "rgba(120,255,180,0.9)"); bg.addColorStop(1, "rgba(120,255,180,0)");
    ctx.strokeStyle = bg; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(W * 0.98, H * 0.04); ctx.stroke();
    items.push(["05 SATGPU / NASA DSN UPLINK", W * 0.86, H * 0.12]);
  }
  ctx.globalAlpha = 1;

  if (labels && s > 200) for (const [t, x, y] of items) label(t, x, y);
}

function shadow(x, y, w, h){ // long shadow cast to the right (sun on the left horizon)
  const len = h * 3.2;
  const g = ctx.createLinearGradient(x, y, x + len, y);
  g.addColorStop(0, "rgba(0,0,0,0.45)"); g.addColorStop(0.6, "rgba(0,0,0,0.18)"); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.beginPath(); // tapered, soft-edged shadow wedge
  ctx.moveTo(x - w * 0.3, y - h * 0.01);
  ctx.quadraticCurveTo(x + len * 0.5, y + h * 0.01, x + len, y + h * 0.05);
  ctx.quadraticCurveTo(x + len * 0.5, y + h * 0.1, x - w * 0.3, y + h * 0.07);
  ctx.closePath(); ctx.fill();
}
function cylinder(x, y, w, h, light, dark){
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, light); g.addColorStop(0.6, dark); g.addColorStop(1, "#2a2926");
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = dark; ctx.beginPath(); ctx.ellipse(x + w, y + h / 2, h * 0.2, h / 2, 0, 0, Math.PI * 2); ctx.fill();
}
function label(t, x, y){
  ctx.font = "11px Courier New"; const tw = ctx.measureText(t).width;
  const lx = Math.min(x + 18, W - tw - 24), ly = Math.max(70, y - 22); // keep on screen, below HUD
  ctx.strokeStyle = "rgba(255,184,0,0.8)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(lx, ly); ctx.lineTo(lx + 8, ly); ctx.stroke();
  ctx.fillStyle = "rgba(4,16,36,0.8)"; ctx.fillRect(lx + 8, ly - 9, tw + 8, 15);
  ctx.fillStyle = "#ffd970"; ctx.fillText(t, lx + 12, ly + 2);
}

function drawEarth(x, y, r){
  const g = ctx.createRadialGradient(x - r * 0.4, y - r * 0.3, r * 0.1, x, y, r);
  g.addColorStop(0, "#9fd3ff"); g.addColorStop(0.5, "#2a6fb8"); g.addColorStop(1, "#0a1f44");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(90,140,70,0.7)"; ctx.beginPath(); ctx.ellipse(x - r * 0.2, y + r * 0.1, r * 0.3, r * 0.45, 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.55)"; ctx.beginPath(); ctx.ellipse(x + r * 0.1, y - r * 0.4, r * 0.55, r * 0.12, -0.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.beginPath(); ctx.arc(x + r * 0.45, y, r, -Math.PI / 2, Math.PI / 2); ctx.ellipse(x + r * 0.45, y, r * 0.6, r, 0, Math.PI / 2, -Math.PI / 2, true); ctx.fill();
}

// ---------- main render ----------
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;

function render(){
  const z = ease(state.z); // 0 = orbit, 1 = on-site
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1 - z * 0.6; ctx.drawImage(stars, 0, 0); ctx.globalAlpha = 1;

  // Earth hangs low on the horizon from the south pole
  drawEarth(W * 0.82 - z * W * 0.1, H * (0.2 + z * 0.08), Math.min(W, H) * (0.035 + z * 0.03));

  // Phase A (z<0.55): globe grows, site at its lower limb moves to screen centre
  const R0 = Math.min(W, H) * 0.36, Rk = R0 * Math.pow(60, Math.min(1, z / 0.55));
  const siteX = W / 2, siteYOnGlobe = 0.93; // south pole near the bottom limb
  const gx = W / 2, gy = H / 2 - (Rk * siteYOnGlobe - 0) * Math.min(1, z / 0.55) + 0;
  if (z < 0.6){
    ctx.globalAlpha = 1 - Math.max(0, (z - 0.45) / 0.15);
    ctx.drawImage(moonTex, gx - Rk, gy - Rk, Rk * 2, Rk * 2);
    // site marker
    const mx = gx, my = gy + Rk * siteYOnGlobe;
    ctx.strokeStyle = "#ffb800"; ctx.lineWidth = 1.2;
    const pr = 8 + Math.sin(state.t * 3) * 3;
    ctx.beginPath(); ctx.arc(mx, my, pr, 0, Math.PI * 2); ctx.stroke();
    if (state.labels){ ctx.font = "11px Courier New"; ctx.fillStyle = "#ffd970"; ctx.fillText("@MOONBASE.BOT  " + SITE.name, mx + 14, my - 10); }
    ctx.globalAlpha = 1;
  }

  // Phase B (z>0.45): oblique surface view of the site, zooming in on the structure
  if (z > 0.45){
    const k = Math.min(1, (z - 0.45) / 0.55);
    ctx.globalAlpha = Math.min(1, (z - 0.45) / 0.15);
    const horizon = H * (0.42 - 0.12 * k);
    // curved horizon line of the near limb
    ctx.save();
    ctx.beginPath(); ctx.moveTo(0, horizon + 20); ctx.quadraticCurveTo(W / 2, horizon - 25, W, horizon + 20); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.clip();
    const scale = 1 + k * 1.6, tw = W * scale, th = (H - horizon + 30) * scale;
    ctx.drawImage(terrain, W / 2 - tw / 2, horizon - 30 - (th - (H - horizon + 30)) * 0.55, tw, th);
    // distance haze toward horizon (none on the Moon really — just dims with grazing light)
    const fg = ctx.createLinearGradient(0, horizon - 25, 0, horizon + H * 0.15);
    fg.addColorStop(0, "rgba(0,0,0,0.75)"); fg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = fg; ctx.fillRect(0, horizon - 30, W, H * 0.2);
    // sun-side warm rim light
    const sl = ctx.createLinearGradient(0, 0, W, 0);
    sl.addColorStop(0, "rgba(255,235,200,0.12)"); sl.addColorStop(0.5, "rgba(0,0,0,0)"); sl.addColorStop(1, "rgba(0,0,0,0.35)");
    ctx.fillStyle = sl; ctx.fillRect(0, 0, W, H);
    ctx.restore();
    // distant Shackleton crater rim mountains on horizon
    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath(); ctx.moveTo(0, horizon + 18);
    const r = rng(5); for (let x = 0; x <= W; x += 24) ctx.lineTo(x, horizon + 6 - r() * 18 * (1 - Math.abs(x / W - 0.5)));
    ctx.lineTo(W, horizon + 20); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,230,190,0.6)"; ctx.fillRect(0, horizon + 2, W * 0.25, 1); // sunlit peaks of eternal light
    // Low sun glare on the left horizon
    const sg = ctx.createRadialGradient(-W * 0.02, horizon, 0, -W * 0.02, horizon, W * 0.25);
    sg.addColorStop(0, "rgba(255,250,235,0.95)"); sg.addColorStop(0.08, "rgba(255,240,210,0.4)"); sg.addColorStop(1, "rgba(255,240,210,0)");
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W * 0.4, H);

    const s = Math.min(W * 0.95, Math.min(W, H) * (0.6 + k * 1.0)); // keep whole base in frame
    const cy = H * (0.66 + 0.04 * k);
    const step = state.build ? state.buildT : 5;
    drawBase(W / 2, cy, s, step, state.labels);
    ctx.globalAlpha = 1;
  }

  const alt = Math.round(100000 * Math.pow(1 - z, 3) + 0.05);
  const mode = z < 0.3 ? "ORBIT" : z < 0.8 ? "APPROACH" : "SITE";
  hud.innerHTML = `<b>@MOONBASE.BOT // WORLD VIEW</b><br>VIEW: ${mode} &nbsp; ALT: ${alt.toLocaleString()} m<br>SITE: ${SITE.name}<br>SUN ELEV: 1.5° (polar) &nbsp; EARTH: ABOVE HORIZON` +
    (state.build ? `<br><b>BUILD SIM STEP ${Math.min(5, Math.floor(state.buildT) + 1)}/5</b>` : "");
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now; state.t += dt;
  if (state.auto){
    // orbit -> site, hold, back out
    const cyc = (state.t % 24) / 24;
    state.target = cyc < 0.4 ? cyc / 0.4 : cyc < 0.85 ? 1 : 1 - (cyc - 0.85) / 0.15;
    zoomEl.value = state.target * 1000;
  }
  state.z += (state.target - state.z) * Math.min(1, dt * 3);
  if (state.build){ state.buildT += dt * 0.6; if (state.buildT > 6.5) state.buildT = 0; }
  if (!stars) resize();
  if (stars) render();
  requestAnimationFrame(frame);
}

function resize(){
  const w = cv.clientWidth, h = cv.clientHeight;
  if (w < 2 || h < 2) return; // hidden (e.g. inside an inactive tab) — wait for a real size
  if (w === W && h === H && stars) return;
  W = w; H = h;
  cv.width = W * DPR; cv.height = H * DPR;
  stars = makeStars();
  moonTex = makeMoon(Math.round(Math.min(W, H) * 0.36 * 2)); // 2x for zoom detail
  terrain = makeTerrain(Math.round(W * 1.2), Math.round(H * 0.9));
}

const btn = id => document.getElementById(id);
function go(t){ state.auto = false; btn("b-auto").classList.remove("on"); state.target = t; zoomEl.value = t * 1000; }
btn("b-orbit").onclick = () => go(0);
btn("b-approach").onclick = () => go(0.5);
btn("b-site").onclick = () => go(1);
btn("b-auto").onclick = e => { state.auto = !state.auto; e.target.classList.toggle("on", state.auto); };
btn("b-labels").onclick = e => { state.labels = !state.labels; e.target.classList.toggle("on", state.labels); };
btn("b-build").onclick = e => { state.build = !state.build; state.buildT = 0; e.target.classList.toggle("on", state.build); if (state.build) go(1); };
zoomEl.oninput = () => go(zoomEl.value / 1000);
cv.addEventListener("wheel", e => { e.preventDefault(); go(Math.max(0, Math.min(1, state.target - e.deltaY * 0.001))); }, { passive: false });
// Allow parent page to drive it: postMessage({moonbase:"site"|"orbit"|"build"})
window.addEventListener("message", e => { const m = e.data && e.data.moonbase; if (m === "orbit") go(0); else if (m === "site") go(1); else if (m === "build") btn("b-build").click(); });

window.addEventListener("resize", resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
resize(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
