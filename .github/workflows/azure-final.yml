name: Publish final LunaRecycle to Azure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  azure:
    runs-on: ubuntu-24.04
    environment: azure-final
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Inspect and package final build
        shell: bash
        run: |
          python3 node.py inspect
          python3 node.py publish
      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish final site to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: GITREPOVSLOCAL
          output_location: ''
          skip_app_build: true
      - name: Azure deployment status
        shell: bash
        run: |
          echo 'Azure authentication completed for cleanskiier27 final.main.luna.eu.'
          echo 'When configured, AZURE_STATIC_WEB_APPS_API_TOKEN publishes GITREPOVSLOCAL.'
