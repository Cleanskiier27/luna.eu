name: Test and publish LunaRecycle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: advice.defaultBranchName
  GIT_CONFIG_VALUE_0: 'false'

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Test and document static application
        shell: bash
        run: |
          set -euo pipefail
          test -f GITREPOVSLOCAL/networkbuster/index.html
          test -f GITREPOVSLOCAL/networkbuster/app.js
          test -f GITREPOVSLOCAL/networkbuster/index.css
          test -f GITREPOVSLOCAL/networkbuster/history.html
          test -f GITREPOVSLOCAL/html-fetch-tool/index.html
          test -f GITREPOVSLOCAL/launch.html
          test -f GITREPOVSLOCAL/admin.html
          test -f GITREPOVSLOCAL/azure-devops-dashboard.html
          test -f GITREPOVSLOCAL/post/index.html
          test -f GITREPOVSLOCAL/documentation.html
          test -f GITREPOVSLOCAL/imported-programs/index.html
          test -f GITREPOVSLOCAL/imported-programs/flash-commands.html
          grep -q 'id="pipelines"' GITREPOVSLOCAL/azure-devops-dashboard.html
          grep -q 'aiplatform.googleapis.com' GITREPOVSLOCAL/post/index.html
          grep -q 'PHASE 6' GITREPOVSLOCAL/documentation.html
          grep -q 'Documentation' GITREPOVSLOCAL/index.html
          ! grep -R -nE 'gho_[A-Za-z0-9]+|access_token=[A-Za-z0-9._-]+' GITREPOVSLOCAL README.md
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          for path in Path('GITREPOVSLOCAL').rglob('*.html'):
              HTMLParser().feed(path.read_text(encoding='utf-8'))
              print(f'validated {path}')
          PY
          echo 'documentation phase complete'
          python3 node.py inspect
          python3 node.py publish
      - name: Publish warning-free gh-pages branch
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          publish_dir=$(mktemp -d)
          cp -a GITREPOVSLOCAL/. "$publish_dir/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$publish_dir/." .
          touch .nojekyll
          git add -A
          git commit -m "Publish LunaRecycle ${GITHUB_SHA}" >/dev/null
          git push --force origin gh-pages
